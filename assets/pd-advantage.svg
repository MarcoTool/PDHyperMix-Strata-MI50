<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Prefill on an RTX 3070 against prefill on the two MI50s</title>
  <desc id="d">Flash-Next IQ3_S, one PC. Gray: 2× MI50 do prefill and decode. Blue: an RTX 3070 does prefill, 2× MI50 do decode. Prefill speed at a 32K prompt: 391 against 1,597 tokens per second. Time to first token at 32K: 84.0 against 22.5 seconds. Time to first token at 258K: 722.8 against 179.8 seconds.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
    .base { stroke: #c3c2b7; }
    .f1 { fill: #2a78d6; } .f0 { fill: #b5b3aa; } .t1 { fill: #1f63b8; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #98968f; }
      .base { stroke: #383835; }
      .f1 { fill: #3987e5; } .f0 { fill: #5c5b56; } .t1 { fill: #7fb3f0; }
    }
    text { font-size: 13px; }
    .h { font-size: 18px; font-weight: 600; }
    .p { font-size: 14px; font-weight: 600; }
    .num { font-size: 13px; font-variant-numeric: tabular-nums; }
    .gain { font-size: 13px; font-weight: 600; }
  </style>
  <rect class="surface" width="960" height="300" rx="8"/>
  <text class="ink h" x="24" y="36">Prefill on an RTX 3070 instead of the two MI50s</text>
  <text class="ink2" x="24" y="58">Flash-Next IQ3_S. Decode runs on the two MI50s in both cases; the gain depends on the prefill card.</text>

  <!-- legend -->
  <g transform="translate(24,80)">
    <rect class="f0" x="0" y="0" width="14" height="14" rx="3"/>
    <text class="ink2" x="22" y="12">Prefill and decode on 2× MI50</text>
    <rect class="f1" x="250" y="0" width="14" height="14" rx="3"/>
    <text class="ink2" x="272" y="12">Prefill on an RTX 3070, decode on 2× MI50</text>
  </g>

  <!-- panel 1: prefill tok/s at 32K, 1,700 = 220 px -->
  <g transform="translate(24,134)">
    <text class="ink p" x="0" y="0">Prefill speed, 32K prompt</text>
    <text class="muted" x="0" y="19">tokens/s, higher is better</text>
    <line class="base" x1="0" y1="36" x2="0" y2="122" stroke-width="1"/>
    <rect class="f0" x="1" y="44" width="50.6" height="26" rx="3"/>
    <text class="ink num" x="58" y="62">391</text>
    <rect class="f1" x="1" y="82" width="206.7" height="26" rx="3"/>
    <text class="ink num" x="214" y="100">1,597</text>
  </g>

  <!-- panel 2: TTFT at 32K, 90 s = 220 px -->
  <g transform="translate(336,134)">
    <text class="ink p" x="0" y="0">First token, 32K prompt</text>
    <text class="muted" x="0" y="19">seconds, lower is better</text>
    <line class="base" x1="0" y1="36" x2="0" y2="122" stroke-width="1"/>
    <rect class="f0" x="1" y="44" width="205.3" height="26" rx="3"/>
    <text class="ink num" x="213" y="62">84.0 s</text>
    <rect class="f1" x="1" y="82" width="55" height="26" rx="3"/>
    <text class="ink num" x="63" y="100">22.5 s</text>
  </g>

  <!-- panel 3: TTFT at 258K, 780 s = 220 px -->
  <g transform="translate(648,134)">
    <text class="ink p" x="0" y="0">First token, 258K prompt</text>
    <text class="muted" x="0" y="19">seconds, lower is better</text>
    <line class="base" x1="0" y1="36" x2="0" y2="122" stroke-width="1"/>
    <rect class="f0" x="1" y="44" width="203.9" height="26" rx="3"/>
    <text class="ink num" x="211" y="62">722.8 s</text>
    <rect class="f1" x="1" y="82" width="50.7" height="26" rx="3"/>
    <text class="ink num" x="58" y="100">179.8 s</text>
  </g>

  <text class="muted" x="24" y="284">Measured on one PC: 2× AMD Instinct MI50 32 GB, NVIDIA RTX 3070 16 GB, Strata, Linux.</text>
</svg>
